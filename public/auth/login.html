<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - Whisp</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --card: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.16);
      --text: #f1f5f9;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --red: #f87171;
      --green: #34d399;
      --serif: "DM Serif Display", Georgia, serif;
      --sans: "Inter", system-ui, -apple-system, sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    .glow {
      position: fixed;
      top: 10%; left: 50%; transform: translateX(-50%);
      width: 800px; height: 500px;
      background: radial-gradient(ellipse, rgba(59,130,246,0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    .auth-card {
      position: relative;
      z-index: 1;
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
      margin-bottom: 28px;
    }
    .brand-mark { width: 28px; height: 28px; flex-shrink: 0; }
    h1 {
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      color: var(--text);
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-2);
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 8px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      font-family: var(--sans);
      font-size: 15px;
      padding: 13px 16px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      outline: none;
      color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="email"]::placeholder,
    input[type="password"]::placeholder { color: var(--text-3); }
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: rgba(59,130,246,0.5);
      box-shadow: 0 0 0 2px rgba(59,130,246,0.5);
    }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text);
      -webkit-box-shadow: 0 0 0 1000px #101729 inset;
      caret-color: var(--text);
    }
    .btn {
      width: 100%;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      padding: 13px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      margin-top: 8px;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn:focus-visible { outline: 2px solid rgba(59,130,246,0.6); outline-offset: 2px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      color: var(--red);
      font-size: 13px;
      line-height: 1.5;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
    }
    .error.visible { display: block; }
    .success {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.25);
      color: var(--green);
      font-size: 13px;
      line-height: 1.5;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
    }
    .success.visible { display: block; }
    .footer-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-3);
    }
    .footer-link a {
      color: var(--text-2);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
    }
    .footer-link a:hover { color: var(--text); }
    .forgot {
      display: block;
      text-align: right;
      font-size: 12px;
      color: var(--text-3);
      text-decoration: none;
      margin-top: 8px;
      transition: color 0.15s ease;
    }
    .forgot:hover { color: var(--text-2); }
    .lang-toggle {
      position: absolute;
      top: 49px;
      right: 40px;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .lang-toggle:hover { color: var(--text); border-color: var(--border-strong); }
    .lang-toggle:focus-visible { outline: 2px solid rgba(59,130,246,0.6); outline-offset: 2px; }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .auth-card { padding: 36px 24px; }
      .lang-toggle { top: 37px; right: 24px; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="auth-card">
    <a class="brand" href="/"><img class="brand-mark" src="/logo.png" alt="" width="32" height="32"> Whisp</a>
    <button type="button" class="lang-toggle" id="lang-toggle" onclick="toggleLang()">PL</button>
    <h1 id="title" data-i18n="login.h1">Log in</h1>
    <p class="subtitle" id="subtitle" data-i18n="login.sub">Access your Whisp dashboard.</p>

    <div class="error" id="error-msg"></div>
    <div class="success" id="forgot-msg"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email" data-i18n="login.email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" data-i18n-placeholder="login.emailPh" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password" data-i18n="login.password">Password</label>
        <input type="password" id="password" placeholder="Your password" data-i18n-placeholder="login.passwordPh" required autocomplete="current-password">
        <a href="#" class="forgot" id="forgot-link" data-i18n="login.forgot">Forgot password?</a>
      </div>
      <button type="submit" class="btn" id="submit-btn">Log in</button>
    </form>

    <form id="forgot-form" style="display:none">
      <div class="form-group">
        <label for="forgot-email" data-i18n="login.email">Email</label>
        <input type="email" id="forgot-email" placeholder="you@example.com" data-i18n-placeholder="login.emailPh" required autocomplete="email">
        <a href="#" class="forgot" id="back-link" data-i18n="forgot.back">Back to log in</a>
      </div>
      <button type="submit" class="btn" id="forgot-btn">Send link</button>
    </form>

    <p class="footer-link"><span data-i18n="login.noAccount">Don't have an account?</span> <a href="/" data-i18n="login.signup">Sign up</a></p>
  </div>

  <script>
    // --- i18n: the homepage's engine (public/landing/index.html), same 'whisp-lang' key so the choice carries across pages ---
    var i18n = {
      en: {
        "page.title": "Log in - Whisp",
        "login.h1": "Log in", "login.sub": "Access your Whisp dashboard.",
        "login.email": "Email", "login.emailPh": "you@example.com",
        "login.password": "Password", "login.passwordPh": "Your password", "login.forgot": "Forgot password?",
        "login.btn": "Log in", "login.busy": "Logging in...",
        "login.noAccount": "Don't have an account?", "login.signup": "Sign up",
        "err.fill": "Please fill in all fields.", "err.invalid": "Invalid credentials.", "err.network": "Network error. Please try again.",
        // The API's 401 is both a wrong password and no password yet (its own words are for developers).
        "api.401": "Wrong e-mail or password. No password yet? Set it with the link in your e-mail from Whisp, or write to us (jakub@whisp.so).",
        "forgot.h1": "Forgot your password?", "forgot.sub": "Enter the e-mail of your Whisp account and we'll send you a link to set a new password.",
        "forgot.btn": "Send link", "forgot.busy": "Sending...", "forgot.back": "Back to log in",
        "forgot.sent": "If this is the address of a Whisp account that has a password, we've sent it a link to set a new one. The link works for {minutes} minutes. Nothing arrived? Check your spam folder or write to jakub@whisp.so. Never set a password? Write to us too and we'll send you a link.",
        "forgot.off": "We can't send password links by e-mail yet. Write to jakub@whisp.so and we'll get you back into your dashboard.",
        "forgot.429": "Too many requests. Please try again later.", "forgot.fail": "Something went wrong. Please try again.",
        "forgot.title": "Reset password - Whisp"
      },
      pl: {
        // \u00a0 (non-breaking space) after one-letter words (w, z, i...) keeps them off the end of a line, as Polish typography requires;
        // \u2011 is a hyphen a line cannot break at, so "e-mail" is never split into "e-" / "mail".
        "page.title": "Logowanie - Whisp",
        "login.h1": "Zaloguj się", "login.sub": "Wejdź do swojego panelu firmy w\u00a0Whisp.",
        "login.email": "E-mail", "login.emailPh": "biuro@twoja-firma.pl",
        "login.password": "Hasło", "login.passwordPh": "Twoje hasło", "login.forgot": "Nie pamiętasz hasła?",
        "login.btn": "Zaloguj się", "login.busy": "Logowanie...",
        "login.noAccount": "Nie masz konta?", "login.signup": "Załóż konto",
        "err.fill": "Wpisz e\u2011mail i\u00a0hasło.", "err.invalid": "Nieprawidłowy e\u2011mail lub hasło.", "err.network": "Błąd sieci. Spróbuj ponownie.",
        // The API answers in English - in Polish the text for its HTTP status (401 is both a wrong password and no password yet).
        "api.400": "Wpisz e\u2011mail i\u00a0hasło.",
        "api.401": "Nieprawidłowy e\u2011mail lub hasło. Nie masz jeszcze hasła? Ustaw je przez link z\u00a0e\u2011maila od Whisp albo napisz do nas (jakub@whisp.so).",
        "api.429": "Za dużo prób logowania. Spróbuj ponownie później.",
        "api.other": "Coś poszło nie tak. Spróbuj ponownie.",
        "forgot.h1": "Nie pamiętasz hasła?", "forgot.sub": "Podaj e\u2011mail swojego konta w\u00a0Whisp - wyślemy na niego link do ustawienia nowego hasła.",
        "forgot.btn": "Wyślij link", "forgot.busy": "Wysyłanie...", "forgot.back": "Wróć do logowania",
        "forgot.sent": "Jeśli to adres konta w\u00a0Whisp, które ma już hasło, wysłaliśmy na niego link do ustawienia nowego. Link działa przez {minutes}\u00a0minut. Nic nie przyszło? Sprawdź folder spam albo napisz do nas (jakub@whisp.so). Nie masz jeszcze hasła? Też napisz - wyślemy link do jego ustawienia.",
        "forgot.off": "Linków do zmiany hasła nie wysyłamy jeszcze e\u2011mailem. Napisz do nas (jakub@whisp.so) - pomożemy Ci wrócić do panelu.",
        "forgot.429": "Za dużo prób. Spróbuj ponownie później.", "forgot.fail": "Coś poszło nie tak. Spróbuj ponownie.",
        "forgot.title": "Nowe hasło - Whisp"
      }
    };

    var currentLang = (function() {
      var saved = null;
      try { saved = localStorage.getItem('whisp-lang'); } catch (e) {}
      if (saved === 'en' || saved === 'pl') return saved;
      var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      return nav.indexOf('pl') === 0 ? 'pl' : 'en';
    })();

    function t(key) {
      var dict = i18n[currentLang] || i18n.en;
      return dict[key] !== undefined ? dict[key] : i18n.en[key];
    }

    // Text set from code (messages, button states) is kept as a function of the language, so a switch re-renders it.
    var said = {};
    function say(id, text) {
      said[id] = typeof text === 'function' ? text : function() { return t(text); };
      document.getElementById(id).textContent = said[id]();
    }

    // The API's messages are English: in English shown as they are, unless the page has its own text for the HTTP
    // status (401); in Polish, the text for the status.
    function apiError(status, message, fallbackKey) {
      if (currentLang !== 'pl') return i18n.en['api.' + status] || message || t(fallbackKey);
      return i18n.pl['api.' + status] || i18n.pl['api.other'];
    }

    // The tab's title follows the card ("Forgot password?" switches it to its own).
    var titleKey = 'page.title';
    function applyLang(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var val = t(el.getAttribute('data-i18n'));
        if (val === undefined) return;
        if (el.getAttribute('data-i18n-html')) el.innerHTML = val;
        else el.textContent = val;
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
        el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
      });
      for (var id in said) document.getElementById(id).textContent = said[id]();
      document.title = t(titleKey);
      document.documentElement.lang = lang;
      var toggle = document.getElementById('lang-toggle');
      toggle.textContent = lang === 'en' ? 'PL' : 'EN';
      toggle.title = lang === 'en' ? 'Polski' : 'English';
    }

    // Only a click on the switch is saved; a default from the browser is worked out again on every visit.
    function toggleLang() {
      var lang = currentLang === 'en' ? 'pl' : 'en';
      try { localStorage.setItem('whisp-lang', lang); } catch (e) {}
      applyLang(lang);
    }

    applyLang(currentLang);
  </script>

  <script>
    say("submit-btn", "login.btn");
    say("forgot-btn", "forgot.btn");

    // "Forgot password?": the same card asks for the e-mail instead of the password.
    function showForgot(on) {
      document.getElementById("login-form").style.display = on ? "none" : "";
      document.getElementById("forgot-form").style.display = on ? "" : "none";
      document.getElementById("title").setAttribute("data-i18n", on ? "forgot.h1" : "login.h1");
      document.getElementById("subtitle").setAttribute("data-i18n", on ? "forgot.sub" : "login.sub");
      titleKey = on ? "forgot.title" : "page.title";
      document.getElementById("error-msg").classList.remove("visible");
      document.getElementById("forgot-msg").classList.remove("visible");
      if (on) document.getElementById("forgot-email").value = document.getElementById("email").value.trim();
      applyLang(currentLang);
    }
    document.getElementById("forgot-link").addEventListener("click", function(e) { e.preventDefault(); showForgot(true); });
    document.getElementById("back-link").addEventListener("click", function(e) { e.preventDefault(); showForgot(false); });

    document.getElementById("forgot-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      var errorEl = document.getElementById("error-msg"), okEl = document.getElementById("forgot-msg"), btn = document.getElementById("forgot-btn");
      errorEl.classList.remove("visible");
      okEl.classList.remove("visible");
      btn.disabled = true;
      say("forgot-btn", "forgot.busy");
      try {
        var res = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("forgot-email").value.trim(), lang: currentLang })
        });
        var data = await res.json().catch(function() { return {}; });
        if (res.ok) {
          // The same answer for every address: the page never says whether it has an account. While no reset e-mail
          // can reach anyone (sending: false), it says so and names the support address instead of a link.
          var minutes = data.minutes || 60;
          if (data.sending === false) say("forgot-msg", "forgot.off");
          else say("forgot-msg", function() { return t("forgot.sent").replace("{minutes}", minutes); });
          okEl.classList.add("visible");
        } else {
          say("error-msg", res.status === 429 ? "forgot.429" : "forgot.fail");
          errorEl.classList.add("visible");
        }
      } catch (err) {
        say("error-msg", "err.network");
        errorEl.classList.add("visible");
      }
      btn.disabled = false;
      say("forgot-btn", "forgot.btn");
    });

    // If already logged in, redirect
    if (localStorage.getItem("wctx-dashboard-token")) {
      window.location.href = "/dashboard";
    }

    document.getElementById("login-form").addEventListener("submit", async function(e) {
      e.preventDefault();

      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;
      var errorEl = document.getElementById("error-msg");
      var btn = document.getElementById("submit-btn");

      errorEl.classList.remove("visible");

      if (!email || !password) {
        say("error-msg", "err.fill");
        errorEl.classList.add("visible");
        return;
      }

      btn.disabled = true;
      say("submit-btn", "login.busy");

      try {
        var res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password })
        });

        var data = await res.json();

        if (!res.ok) {
          say("error-msg", function() { return apiError(res.status, data.error, "err.invalid"); });
          errorEl.classList.add("visible");
          btn.disabled = false;
          say("submit-btn", "login.btn");
          return;
        }

        // Store token and redirect
        localStorage.setItem("wctx-dashboard-token", data.token);
        localStorage.setItem("wctx-tenant-id", data.tenantId);
        window.location.href = "/dashboard";
      } catch (err) {
        say("error-msg", "err.network");
        errorEl.classList.add("visible");
        btn.disabled = false;
        say("submit-btn", "login.btn");
      }
    });
  </script>
</body>
</html>
