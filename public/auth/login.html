<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — website.context</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf8;
      --surface: #ffffff;
      --text: #1c1917;
      --text-2: #57534e;
      --text-3: #a8a29e;
      --border: #e7e5e4;
      --red: #ef4444;
      --green: #16a34a;
      --serif: "DM Serif Display", Georgia, serif;
      --sans: "Archivo", -apple-system, sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 20px;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 8px rgba(28,25,23,0.04), 0 8px 32px rgba(28,25,23,0.06);
    }
    .logo-mark {
      width: 36px; height: 36px;
      background: var(--text);
      border-radius: 9px;
      margin-bottom: 28px;
      position: relative;
    }
    .logo-mark::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 2px solid var(--bg);
      border-radius: 5px;
    }
    h1 {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 400;
      margin-bottom: 8px;
      color: var(--text);
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-2);
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 6px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      font-family: var(--sans);
      font-size: 15px;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: #fafaf8;
      outline: none;
      color: var(--text);
      transition: border-color 0.2s;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--text-3);
    }
    .btn {
      width: 100%;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 700;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: var(--text);
      color: #fff;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .btn:hover { background: #333; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      color: var(--red);
      font-size: 13px;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
    }
    .error.visible { display: block; }
    .footer-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-3);
    }
    .footer-link a {
      color: var(--text-2);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-link a:hover { text-decoration: underline; }
    .forgot {
      display: block;
      text-align: right;
      font-size: 12px;
      color: var(--text-3);
      text-decoration: none;
      margin-top: 8px;
    }
    .forgot:hover { color: var(--text-2); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo-mark"></div>
    <h1>Log in</h1>
    <p class="subtitle">Access your website.context dashboard.</p>

    <div class="error" id="error-msg"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" required autocomplete="current-password">
        <a href="#" class="forgot">Forgot password?</a>
      </div>
      <button type="submit" class="btn" id="submit-btn">Log in</button>
    </form>

    <p class="footer-link">Don't have an account? <a href="/">Sign up</a></p>
  </div>

  <script>
    // If already logged in, redirect
    if (localStorage.getItem("wctx-dashboard-token")) {
      window.location.href = "/dashboard";
    }

    document.getElementById("login-form").addEventListener("submit", async function(e) {
      e.preventDefault();

      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;
      var errorEl = document.getElementById("error-msg");
      var btn = document.getElementById("submit-btn");

      errorEl.classList.remove("visible");

      if (!email || !password) {
        errorEl.textContent = "Please fill in all fields.";
        errorEl.classList.add("visible");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        var res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password })
        });

        var data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || "Invalid credentials.";
          errorEl.classList.add("visible");
          btn.disabled = false;
          btn.textContent = "Log in";
          return;
        }

        // Store token and redirect
        localStorage.setItem("wctx-dashboard-token", data.token);
        localStorage.setItem("wctx-tenant-id", data.tenantId);
        window.location.href = "/dashboard";
      } catch (err) {
        errorEl.textContent = "Network error. Please try again.";
        errorEl.classList.add("visible");
        btn.disabled = false;
        btn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
