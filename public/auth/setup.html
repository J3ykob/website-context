<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set your password - Whisp</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --card: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.16);
      --text: #f1f5f9;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --red: #f87171;
      --green: #34d399;
      --serif: "DM Serif Display", Georgia, serif;
      --sans: "Inter", system-ui, -apple-system, sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    .glow {
      position: fixed;
      top: 10%; left: 50%; transform: translateX(-50%);
      width: 800px; height: 500px;
      background: radial-gradient(ellipse, rgba(59,130,246,0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    .auth-card {
      position: relative;
      z-index: 1;
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
      margin-bottom: 28px;
    }
    .brand-mark { width: 28px; height: 28px; flex-shrink: 0; }
    h1 {
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      color: var(--text);
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-2);
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 8px;
    }
    input[type="password"] {
      width: 100%;
      font-family: var(--sans);
      font-size: 15px;
      padding: 13px 16px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      outline: none;
      color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="password"]::placeholder { color: var(--text-3); }
    input[type="password"]:focus {
      border-color: rgba(59,130,246,0.5);
      box-shadow: 0 0 0 2px rgba(59,130,246,0.5);
    }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text);
      -webkit-box-shadow: 0 0 0 1000px #101729 inset;
      caret-color: var(--text);
    }
    .btn {
      width: 100%;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      padding: 13px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      margin-top: 8px;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn:focus-visible { outline: 2px solid rgba(59,130,246,0.6); outline-offset: 2px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      color: var(--red);
      font-size: 13px;
      line-height: 1.5;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
    }
    .error.visible { display: block; }
    .success {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.25);
      color: var(--green);
      font-size: 13px;
      line-height: 1.5;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
    }
    .success.visible { display: block; }
    .footer-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-3);
    }
    .footer-link a {
      color: var(--text-2);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
    }
    .footer-link a:hover { color: var(--text); }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .auth-card { padding: 36px 24px; }
    }
    .terms { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: #94a3b8; margin: 4px 0 18px; cursor: pointer; }
  .terms input { margin-top: 3px; flex: none; }
  .terms a { color: #f1f5f9; }
    .lang-toggle {
      position: absolute;
      top: 49px;
      right: 40px;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .lang-toggle:hover { color: var(--text); border-color: var(--border-strong); }
    .lang-toggle:focus-visible { outline: 2px solid rgba(59,130,246,0.6); outline-offset: 2px; }
    @media (max-width: 480px) {
      .lang-toggle { top: 37px; right: 24px; }
    }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="auth-card">
    <a class="brand" href="/"><svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="8" fill="#3b82f6"/><path d="M8.5 11.5C8.5 9.567 10.067 8 12 8h8c1.933 0 3.5 1.567 3.5 3.5v5c0 1.933-1.567 3.5-3.5 3.5h-5l-3 2.5V20H12c-1.933 0-3.5-1.567-3.5-3.5v-5z" fill="white" opacity="0.95"/><path d="M13.5 12.5c1.5-.8 3.5-.8 5 0" stroke="#3b82f6" stroke-width="1.3" stroke-linecap="round"/><path d="M14.5 15c1 -.5 2.5-.5 3 0" stroke="#3b82f6" stroke-width="1.3" stroke-linecap="round"/></svg> Whisp</a>
    <button type="button" class="lang-toggle" id="lang-toggle" onclick="toggleLang()">PL</button>
    <h1 id="title" data-i18n="setup.h1">Set your password</h1>
    <p class="subtitle" id="subtitle" data-i18n="setup.sub">Create a password to access your Whisp dashboard.</p>

    <div class="error" id="error-msg"></div>
    <div class="success" id="success-msg"></div>

    <form id="setup-form">
      <div class="form-group">
        <label for="password" data-i18n="setup.password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" data-i18n-placeholder="setup.passwordPh" required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirm" data-i18n="setup.confirm">Confirm password</label>
        <input type="password" id="confirm" placeholder="Type it again" data-i18n-placeholder="setup.confirmPh" required minlength="8" autocomplete="new-password">
      </div>
      <label class="terms" id="terms-row">
        <input type="checkbox" id="terms" required>
        <span data-i18n="setup.terms" data-i18n-html="1">On behalf of my business I accept the <a href="/regulamin" target="_blank">Terms</a> and the <a href="/umowa-powierzenia" target="_blank">data processing agreement</a>.</span>
      </label>
      <button type="submit" class="btn" id="submit-btn">Set password</button>
    </form>

    <p class="footer-link"><span id="footer-q" data-i18n="setup.haveAccount">Already have a password?</span> <a href="/auth/login" id="footer-a" data-i18n="setup.login">Log in</a></p>
  </div>

  <script>
    // --- i18n: the homepage's engine (public/landing/index.html), same 'whisp-lang' key so the choice carries across pages ---
    var i18n = {
      en: {
        "page.title": "Set your password - Whisp",
        "setup.h1": "Set your password", "setup.sub": "Create a password to access your Whisp dashboard.",
        "setup.password": "Password", "setup.passwordPh": "At least 8 characters",
        "setup.confirm": "Confirm password", "setup.confirmPh": "Type it again",
        "setup.terms": 'On behalf of my business I accept the <a href="/regulamin" target="_blank">Terms</a> and the <a href="/umowa-powierzenia" target="_blank">data processing agreement</a>.',
        "setup.btn": "Set password", "setup.busy": "Setting up...",
        "setup.haveAccount": "Already have a password?", "setup.login": "Log in",
        "setup.done": "Password set! Redirecting to dashboard...",
        "err.link": "Invalid setup link. Please use the link from your email.",
        "err.short": "Password must be at least 8 characters.", "err.mismatch": "Passwords do not match.",
        "err.generic": "Something went wrong.", "err.network": "Network error. Please try again.",
        "reset.h1": "Set a new password", "reset.sub": "Choose a new password for your Whisp dashboard. You'll be signed out on your other devices.",
        "reset.btn": "Save new password", "reset.busy": "Saving...", "reset.done": "Password changed - taking you to your dashboard...",
        "reset.login": "Password changed - log in with your new password.",
        "reset.title": "Set a new password - Whisp", "reset.back": "Back to log in",
        "reset.notSignedOut": "We could not sign you out on your other devices. If someone else may know your old password, write to jakub@whisp.so.",
        "reset.subFor": "Choose a new password for the Whisp dashboard of {domain}. You'll be signed out on your other devices.",
        // A set-password link that no longer works (used, replaced by a newer one, or its address changed): the way on.
        "setup.api.401": "This link no longer works. Already set a password? Log in. Never set one? Write to jakub@whisp.so and we'll send you a new link."
      },
      pl: {
        // \u00a0 (&nbsp; in the HTML string) after one-letter words (w, z, i...) keeps them off the end of a line, as Polish typography requires;
        // \u2011 is a hyphen a line cannot break at, so "e-maila" is never split into "e-" / "maila".
        "page.title": "Ustaw hasło - Whisp",
        "setup.h1": "Ustaw hasło", "setup.sub": "Utwórz hasło do swojego panelu firmy w\u00a0Whisp.",
        "setup.password": "Hasło", "setup.passwordPh": "Co najmniej 8 znaków",
        "setup.confirm": "Powtórz hasło", "setup.confirmPh": "Wpisz je jeszcze raz",
        "setup.terms": 'W&nbsp;imieniu mojej firmy akceptuję <a href="/regulamin" target="_blank">Regulamin</a> i&nbsp;<a href="/umowa-powierzenia" target="_blank">umowę powierzenia przetwarzania danych</a>.',
        "setup.btn": "Ustaw hasło", "setup.busy": "Zapisywanie...",
        "setup.haveAccount": "Masz już hasło?", "setup.login": "Zaloguj się",
        "setup.done": "Hasło ustawione - przenosimy Cię do panelu...",
        "err.link": "Ten link do ustawienia hasła jest nieprawidłowy. Użyj linku z\u00a0naszego e\u2011maila.",
        "err.short": "Hasło musi mieć co najmniej 8\u00a0znaków.", "err.mismatch": "Hasła nie są takie same.",
        "err.generic": "Coś poszło nie tak. Spróbuj ponownie.", "err.network": "Błąd sieci. Spróbuj ponownie.",
        // The API answers in English - in Polish the text for its HTTP status.
        "api.404": "Nie znaleźliśmy konta dla tego linku.",
        "api.409": "Hasło jest już ustawione. Zaloguj się.",
        "api.429": "Za dużo prób. Spróbuj ponownie później.",
        "api.other": "Coś poszło nie tak. Spróbuj ponownie.",
        "reset.h1": "Ustaw nowe hasło", "reset.sub": "Wybierz nowe hasło do panelu firmy w\u00a0Whisp. Na innych urządzeniach wylogujemy Cię.",
        "reset.btn": "Zapisz nowe hasło", "reset.busy": "Zapisywanie...", "reset.done": "Hasło zmienione - przenosimy Cię do panelu...",
        "reset.login": "Hasło zmienione - zaloguj się nowym hasłem.",
        "reset.title": "Ustaw nowe hasło - Whisp", "reset.back": "Wróć do logowania",
        "reset.notSignedOut": "Nie udało się wylogować Cię na innych urządzeniach. Jeśli ktoś inny może znać Twoje stare hasło, napisz do nas: jakub@whisp.so.",
        "reset.subFor": "Wybierz nowe hasło do panelu firmy {domain} w\u00a0Whisp. Na innych urządzeniach wylogujemy Cię.",
        // A link's own texts for the API's answers: a set-password link that no longer works (used, replaced by a newer
        // one, or its address changed - a link already used is a 401 too), a reset link.
        "setup.api.401": "Ten link już nie działa. Masz już hasło? Zaloguj się. Nie masz jeszcze hasła? Napisz do nas (jakub@whisp.so) - wyślemy nowy link.",
        "reset.api.401": "Ten link wygasł albo został już użyty. Poproś o\u00a0nowy na stronie logowania (Nie pamiętasz hasła?).",
        "reset.api.503": "Nie udało się zapisać hasła. Spróbuj ponownie."
      }
    };

    var currentLang = (function() {
      var saved = null;
      try { saved = localStorage.getItem('whisp-lang'); } catch (e) {}
      if (saved === 'en' || saved === 'pl') return saved;
      // A reset link carries the language its e-mail was written in (the login page's): the page reads the same.
      var linkLang = new URLSearchParams(window.location.hash.slice(1)).get('lang');
      if (linkLang === 'en' || linkLang === 'pl') return linkLang;
      // The link from the e-mail names the business: its id is the domain with "_" for dots, so a .pl business reads Polish.
      if (/_pl$/i.test(new URLSearchParams(window.location.search).get('tenant') || '')) return 'pl';
      var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      return nav.indexOf('pl') === 0 ? 'pl' : 'en';
    })();

    function t(key) {
      var dict = i18n[currentLang] || i18n.en;
      return dict[key] !== undefined ? dict[key] : i18n.en[key];
    }

    // Text set from code (messages, button states) is kept as a function of the language, so a switch re-renders it.
    var said = {};
    function say(id, text) {
      said[id] = typeof text === 'function' ? text : function() { return t(text); };
      document.getElementById(id).textContent = said[id]();
    }

    // The API's messages are English. The page's own text for the answer in this mode comes first, in both languages
    // (a set-password link that no longer works says what to do next); otherwise English shows the API's message as it
    // is, and Polish the text for the HTTP status.
    function apiError(status, message, fallbackKey) {
      var own = (i18n[currentLang] || i18n.en)[(window.mode || 'setup') + '.api.' + status];
      if (own) return own;
      if (currentLang !== 'pl') return message || t(fallbackKey);
      return i18n.pl['api.' + status] || i18n.pl['api.other'];
    }

    // The tab's title follows the page's mode (a reset link switches it to its own).
    var titleKey = 'page.title';
    function applyLang(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var val = t(el.getAttribute('data-i18n'));
        if (val === undefined) return;
        if (el.getAttribute('data-i18n-html')) el.innerHTML = val;
        else el.textContent = val;
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
        el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
      });
      for (var id in said) document.getElementById(id).textContent = said[id]();
      document.title = t(titleKey);
      document.documentElement.lang = lang;
      var toggle = document.getElementById('lang-toggle');
      toggle.textContent = lang === 'en' ? 'PL' : 'EN';
      toggle.title = lang === 'en' ? 'Polski' : 'English';
    }

    // Only a click on the switch is saved; a default from the browser or the link is worked out again on every visit.
    function toggleLang() {
      var lang = currentLang === 'en' ? 'pl' : 'en';
      try { localStorage.setItem('whisp-lang', lang); } catch (e) {}
      applyLang(lang);
    }

    applyLang(currentLang);
  </script>

  <script>
    say("submit-btn", "setup.btn");

    var params = new URLSearchParams(window.location.search);
    var token = params.get("token");
    var tenantId = params.get("tenant");
    // A reset link ("Forgot password?" on the login page): its token rides in the #fragment, never sent to a server
    // (a ?reset= in the query string would be, so it is not read). Read once, then taken out of the address bar and
    // the history, where an unused link stayed usable for its hour.
    var resetToken = new URLSearchParams(window.location.hash.slice(1)).get("reset");
    if (resetToken) history.replaceState(null, "", window.location.pathname + window.location.search);
    var mode = resetToken ? "reset" : "setup";
    var saving = false;
    if (resetToken) {
      document.getElementById("title").setAttribute("data-i18n", "reset.h1");
      document.getElementById("subtitle").setAttribute("data-i18n", "reset.sub");
      titleKey = "reset.title";
      // The owner has a password (forgot it): the footer leads back to the login, not "Already have a password?".
      document.getElementById("footer-q").style.display = "none";
      document.getElementById("footer-a").setAttribute("data-i18n", "reset.back");
      // The Terms were accepted when the password was first set.
      document.getElementById("terms-row").style.display = "none";
      document.getElementById("terms").required = false;
      say("submit-btn", "reset.btn");
      applyLang(currentLang);
      // The business the link is for, before anything is typed: a link someone else asked for and passed on names that
      // someone's business (saving would log the reader into it), and a used or expired link says so at once.
      fetch("/api/auth/reset-link", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: resetToken }) })
        .then(function(res) {
          return res.json().catch(function() { return {}; }).then(function(data) {
            if (res.ok && data.domain) {
              say("subtitle", function() { return t("reset.subFor").replace("{domain}", function() { return data.domain; }); });
            } else if (res.status === 401 && !saving) { // a late answer never hides a save in progress
              say("error-msg", function() { return apiError(401, data.error, "err.generic"); });
              document.getElementById("error-msg").classList.add("visible");
              document.getElementById("setup-form").style.display = "none";
            }
          });
        })
        .catch(function() {}); // no answer: the form stays, and saving says what is wrong
    }

    if (!resetToken && (!token || !tenantId)) {
      say("error-msg", "err.link");
      document.getElementById("error-msg").classList.add("visible");
      document.getElementById("setup-form").style.display = "none";
    }

    document.getElementById("setup-form").addEventListener("submit", async function(e) {
      e.preventDefault();

      var pw = document.getElementById("password").value;
      var confirm = document.getElementById("confirm").value;
      var errorEl = document.getElementById("error-msg");
      var successEl = document.getElementById("success-msg");
      var btn = document.getElementById("submit-btn");

      errorEl.classList.remove("visible");
      successEl.classList.remove("visible");

      if (pw.length < 8) {
        say("error-msg", "err.short");
        errorEl.classList.add("visible");
        return;
      }

      if (pw !== confirm) {
        say("error-msg", "err.mismatch");
        errorEl.classList.add("visible");
        return;
      }

      btn.disabled = true;
      saving = true;
      say("submit-btn", mode + ".busy");

      try {
        var res = await fetch(resetToken ? "/api/auth/reset-password" : "/api/auth/setup-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(resetToken ? { token: resetToken, password: pw }
            : { token: token, tenantId: tenantId, password: pw, termsAccepted: document.getElementById("terms").checked })
        });

        var data = await res.json();

        if (!res.ok) {
          say("error-msg", function() { return apiError(res.status, data.error, "err.generic"); });
          errorEl.classList.add("visible");
          btn.disabled = false;
          saving = false;
          say("submit-btn", mode + ".btn");
          return;
        }

        // Store token and redirect to dashboard. A reset that saved the password but got no session goes to the
        // login page without the session this browser held: this account's ended with the reset (the dashboard
        // would answer 401), and with another business's the login page forwarded to that business's dashboard.
        if (data.token) {
          localStorage.setItem("wctx-dashboard-token", data.token);
          localStorage.setItem("wctx-tenant-id", data.tenantId);
        } else {
          localStorage.removeItem("wctx-dashboard-token");
          localStorage.removeItem("wctx-tenant-id");
        }
        say("success-msg", data.token ? mode + ".done" : "reset.login");
        successEl.classList.add("visible");
        // The other devices could not be signed out (the server failed to end their sessions): said, not promised,
        // and the page stays long enough to read it.
        if (data.signedOut === false) {
          say("error-msg", "reset.notSignedOut");
          errorEl.classList.add("visible");
        }
        setTimeout(function() {
          window.location.href = data.token ? "/dashboard" : "/auth/login";
        }, data.signedOut === false ? 8000 : 1000);
      } catch (err) {
        say("error-msg", "err.network");
        errorEl.classList.add("visible");
        btn.disabled = false;
        saving = false;
        say("submit-btn", mode + ".btn");
      }
    });
  </script>
</body>
</html>
