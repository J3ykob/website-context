<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set your password — website.context</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf8;
      --surface: #ffffff;
      --text: #1c1917;
      --text-2: #57534e;
      --text-3: #a8a29e;
      --border: #e7e5e4;
      --red: #ef4444;
      --green: #16a34a;
      --serif: "DM Serif Display", Georgia, serif;
      --sans: "Archivo", -apple-system, sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 20px;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 8px rgba(28,25,23,0.04), 0 8px 32px rgba(28,25,23,0.06);
    }
    .logo-mark {
      width: 36px; height: 36px;
      background: var(--text);
      border-radius: 9px;
      margin-bottom: 28px;
      position: relative;
    }
    .logo-mark::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 2px solid var(--bg);
      border-radius: 5px;
    }
    h1 {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 400;
      margin-bottom: 8px;
      color: var(--text);
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-2);
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 6px;
    }
    input[type="password"] {
      width: 100%;
      font-family: var(--sans);
      font-size: 15px;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: #fafaf8;
      outline: none;
      color: var(--text);
      transition: border-color 0.2s;
    }
    input[type="password"]:focus {
      border-color: var(--text-3);
    }
    .btn {
      width: 100%;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 700;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: var(--text);
      color: #fff;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .btn:hover { background: #333; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      color: var(--red);
      font-size: 13px;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
    }
    .error.visible { display: block; }
    .success {
      background: rgba(22,163,74,0.08);
      border: 1px solid rgba(22,163,74,0.2);
      color: var(--green);
      font-size: 13px;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
    }
    .success.visible { display: block; }
    .footer-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-3);
    }
    .footer-link a {
      color: var(--text-2);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo-mark"></div>
    <h1>Set your password</h1>
    <p class="subtitle">Create a password to access your website.context dashboard.</p>

    <div class="error" id="error-msg"></div>
    <div class="success" id="success-msg"></div>

    <form id="setup-form">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" placeholder="Type it again" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn" id="submit-btn">Set password</button>
    </form>

    <p class="footer-link">Already have a password? <a href="/auth/login">Log in</a></p>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var token = params.get("token");
    var tenantId = params.get("tenant");

    if (!token || !tenantId) {
      document.getElementById("error-msg").textContent = "Invalid setup link. Please use the link from your email.";
      document.getElementById("error-msg").classList.add("visible");
      document.getElementById("setup-form").style.display = "none";
    }

    document.getElementById("setup-form").addEventListener("submit", async function(e) {
      e.preventDefault();

      var pw = document.getElementById("password").value;
      var confirm = document.getElementById("confirm").value;
      var errorEl = document.getElementById("error-msg");
      var successEl = document.getElementById("success-msg");
      var btn = document.getElementById("submit-btn");

      errorEl.classList.remove("visible");
      successEl.classList.remove("visible");

      if (pw.length < 8) {
        errorEl.textContent = "Password must be at least 8 characters.";
        errorEl.classList.add("visible");
        return;
      }

      if (pw !== confirm) {
        errorEl.textContent = "Passwords do not match.";
        errorEl.classList.add("visible");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Setting up...";

      try {
        var res = await fetch("/api/auth/setup-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, tenantId: tenantId, password: pw })
        });

        var data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || "Something went wrong.";
          errorEl.classList.add("visible");
          btn.disabled = false;
          btn.textContent = "Set password";
          return;
        }

        // Store token and redirect to dashboard
        localStorage.setItem("wctx-dashboard-token", data.token);
        localStorage.setItem("wctx-tenant-id", data.tenantId);
        successEl.textContent = "Password set! Redirecting to dashboard...";
        successEl.classList.add("visible");
        setTimeout(function() {
          window.location.href = "/dashboard";
        }, 1000);
      } catch (err) {
        errorEl.textContent = "Network error. Please try again.";
        errorEl.classList.add("visible");
        btn.disabled = false;
        btn.textContent = "Set password";
      }
    });
  </script>
</body>
</html>
