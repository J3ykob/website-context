services:
  # Main web service
  # Frankfurt since 2026-11-01 (was website-context in Oregon): nearly all customers and their sites are in
  # Europe - every chat and every crawled page crossed the Atlantic.
  - type: web
    name: website-context-fra
    runtime: docker
    plan: standard
    region: frankfurt
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      # TypeSafe Jev: per-turn reply-type + filler classification for the voice bot.
      # Unset -> the bot falls back to a neutral rotating filler (no failure).
      - key: JEV_API_KEY
        sync: false
      # Answer model (2026-09-27: qwen3-235b; the 30b wrote Cyrillic words in Polish).
      # Values here are applied on every blueprint sync - keep them current.
      - key: OPENROUTER_MODEL
        value: anthropic/claude-haiku-5.5
      # BGE embeddings via Workers AI shim (workers/bge-embed) — the old GPU box
      # (176.9.1.133) is gone. BGE_URL takes precedence over BGE_HOST/BGE_PORT.
      - key: BGE_URL
        value: "https://bge-embed.kubalol7982.workers.dev"
      - key: BGE_API_KEY
        sync: false
      - key: QDRANT_HOST
        value: "152.53.243.28"
      - key: QDRANT_PORT
        value: "6333"
      - key: CF_API_TOKEN
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      # Multilingual embeddings (2026-09-27): bge-m3 vectors live in whisp-vectors-m3.
      # The two must always match (bge-large-en -> whisp-vectors).
      # Project agent runner (workers/project-agent): URL of the Worker + its bearer secret.
      - key: PROJECT_AGENT_URL
        value: "https://whisp-project-agent.kubalol7982.workers.dev"
      - key: PROJECT_AGENT_SECRET
        sync: false
      - key: PROJECT_AGENT_MODEL
        value: deepseek/deepseek-v4.1-flash
      - key: PROJECT_AGENT_FALLBACK_MODEL
        value: xiaomi/mimo-v2.6-flash
      - key: PLANNER_MODEL
        value: deepseek/deepseek-v4.1-flash
      # Owner review email (src/multi-tenant/email.ts sendReviewEmail) - template approved 2026-10-13.
      - key: REVIEW_EMAIL_APPROVED
        value: "1"
      # The agent's questions block in the owner review email - approved 2026-10-13.
      - key: REVIEW_EMAIL_QUESTIONS_APPROVED
        value: "1"
      # Result email to the customer (with consent from the chat) - approved 2026-10-13.
      - key: CUSTOMER_RESULT_EMAIL_APPROVED
        value: "1"
      # Network invite + lead page (src/projects/invite.ts, lead.ts).
      # Invite email to listed businesses - template approved 2026-10-20 (templates/emails/network-invite.txt).
      - key: NETWORK_INVITE_EMAIL_APPROVED
        value: "1"
      # Customer email about a network business's offer - approved 2026-10-21 (templates/emails/customer-offer.*.txt).
      # Your own e-mail/phone: never hit the per-recipient message caps (tests, demos) - set on Render.
      - key: MSG_CAP_EXEMPT
        sync: false
      # Privacy policy page (/polityka-prywatnosci) is served only when these are set - set on Render.
      - key: COMPANY_NAME
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: COMPANY_NIP
        sync: false
      # Registry court, KRS number and share capital (art. 206 KSH), shown under the company's name.
      - key: COMPANY_REGISTRY
        sync: false
      # Each legal page's "Obowiązuje od", set when its text changes (src/legal/pages.ts). Without these the
      # code default (2026-10-31) showed, and the Terms and the DPA took the privacy policy's date.
      # The privacy policy text of 2026-11-10 (the AI-decision log may hold health data; the chat window's AI notice).
      - key: PRIVACY_EFFECTIVE_DATE
        value: "2026-11-10"
      # The Terms and the DPA (unchanged since 2026-10-31); also the version recorded when an owner accepts them.
      - key: TERMS_EFFECTIVE_DATE
        value: "2026-10-31"
      # Resend webhook signing secret (Svix) - set in the dashboard/API, never in this file.
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # Meta (WhatsApp/Messenger) app secret for X-Hub-Signature-256 - unset = Meta webhooks refused.
      - key: META_APP_SECRET
        sync: false
      - key: CUSTOMER_OFFER_EMAIL_APPROVED
        value: "1"
      # Owner e-mails in Polish for .pl businesses (templates/emails/owner-welcome.pl.txt, bot-ready.pl.txt) - drafted
      # 2026-11-04, NOT approved yet: "0" sends the English versions (as before).
      - key: OWNER_EMAILS_PL_APPROVED
        value: "0"
      # Owner "set a new password" e-mail (templates/emails/owner-password-reset.*.txt, "Forgot password?" on /auth/login)
      # - approved by the owner 2026-11-04 (EN and PL); "0" would send it only to kubalol7982@gmail.com.
      - key: PASSWORD_RESET_EMAIL_APPROVED
        value: "1"
      # Owner asked for the price its assistant left out of a network request - approved 2026-10-29 (templates/emails/owner-quote.txt).
      - key: OWNER_QUOTE_EMAIL_APPROVED
        value: "1"
      # Customer "your result is ready" by SMS / WhatsApp (templates/messages) - approved 2026-10-26.
      - key: CUSTOMER_UPDATES_APPROVED
        value: "1"
      # "New offer" SMS/WhatsApp/Telegram to the customer (templates/messages/new-offer.*, with our phone) - approved 2026-10-29.
      - key: CUSTOMER_OFFER_UPDATES_APPROVED
        value: "1"
      - key: NETWORK_INVITE_PHONE
        value: "+48 729 086 795"
      - key: NETWORK_PLAN_PRICE_PLN
        value: "149"
      - key: LEAD_EXCLUSIVE_HOURS
        value: "24"
      # Stripe (test mode first): set in the dashboard, never in this file.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: EMBED_MODEL
        value: bge-m3
      - key: VECTORIZE_INDEX
        value: whisp-vectors-m3
      # Pages fetched in parallel per site (crawler). 12 since 2026-11-01: the server is in Oregon and most
      # sites are in Europe - pages took ~12 s each with 6 workers while CPU sat at 10-33%.
      - key: SCRAPE_CONCURRENCY
        value: "12"
      # Scrapes run side by side (the fleet re-scrape took days one at a time; memory 250-550 MB of 2 GB, CPU < 45%).
      - key: SCRAPE_JOBS
        value: "2"
      # Businesses' quoting models (src/pricing/model.ts) price their own requests in the chat, the network
      # businesses relayed to a customer, and the project agent's files. On since 2026-11-03 (wedding set 22/24,
      # construction checks green); a business without a model keeps the old path.
      - key: PRICING_CHAT
        value: "on"
      # Launch switches (src/llm/chat.ts, owner 2026-11-07): other businesses in the chat, the calculation agent,
      # and "we don't have that information + pass it on" for a reply still unsupported after its rewrites.
      - key: NETWORK_CHAT
        value: "off"
      - key: CALC_AGENT
        value: "off"
      - key: UNSURE_FALLBACK
        value: "off"
      - key: PORT
        value: "3210"
      - key: RESEND_API_KEY
        sync: false
      # Admin API auth. MUST be a strong (>=24 char) random string — generate with
      # `openssl rand -hex 32`. If unset/weak, every /api/admin/* route fails closed.
      - key: ADMIN_SECRET
        sync: false
      - key: BROWSERLESS_TOKEN
        sync: false
      # Voice outreach (Twilio). AUTH_TOKEN is needed to validate webhook signatures;
      # FROM_NUMBER + FORWARD_TO drive the call-back forwarding in /api/voice/incoming.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: VOICE_FORWARD_TO
        sync: false

  # Qdrant vector database (private, not exposed to internet)
  - type: pserv
    name: qdrant
    runtime: image
    image:
      url: qdrant/qdrant:latest
    plan: starter
    region: oregon
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 1
