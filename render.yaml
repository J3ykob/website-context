services:
  # Main web service
  - type: web
    name: website-context
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-chat-v3
      - key: BGE_HOST
        value: 176.9.1.133
      - key: BGE_PORT
        value: "7900"
      - key: QDRANT_HOST
        fromService:
          name: qdrant
          type: pserv
          property: host
      - key: QDRANT_PORT
        value: "6333"
      - key: PORT
        value: "3210"

  # Qdrant vector database (private, not exposed to internet)
  - type: pserv
    name: qdrant
    runtime: image
    image:
      url: qdrant/qdrant:latest
    plan: starter
    region: oregon
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 1
