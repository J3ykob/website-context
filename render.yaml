services:
  # Main web service
  - type: web
    name: website-context
    runtime: docker
    plan: standard
    region: oregon
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      # TypeSafe Jev: per-turn reply-type + filler classification for the voice bot.
      # Unset -> the bot falls back to a neutral rotating filler (no failure).
      - key: JEV_API_KEY
        sync: false
      # Answer model (2026-09-27: qwen3-235b; the 30b wrote Cyrillic words in Polish).
      # Values here are applied on every blueprint sync - keep them current.
      - key: OPENROUTER_MODEL
        value: qwen/qwen3-235b-a22b-2507
      # BGE embeddings via Workers AI shim (workers/bge-embed) — the old GPU box
      # (176.9.1.133) is gone. BGE_URL takes precedence over BGE_HOST/BGE_PORT.
      - key: BGE_URL
        value: "https://bge-embed.kubalol7982.workers.dev"
      - key: BGE_API_KEY
        sync: false
      - key: QDRANT_HOST
        value: "152.53.243.28"
      - key: QDRANT_PORT
        value: "6333"
      - key: CF_API_TOKEN
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      # Multilingual embeddings (2026-09-27): bge-m3 vectors live in whisp-vectors-m3.
      # The two must always match (bge-large-en -> whisp-vectors).
      - key: EMBED_MODEL
        value: bge-m3
      - key: VECTORIZE_INDEX
        value: whisp-vectors-m3
      - key: PORT
        value: "3210"
      - key: RESEND_API_KEY
        sync: false
      # Admin API auth. MUST be a strong (>=24 char) random string — generate with
      # `openssl rand -hex 32`. If unset/weak, every /api/admin/* route fails closed.
      - key: ADMIN_SECRET
        sync: false
      - key: BROWSERLESS_TOKEN
        sync: false
      # Voice outreach (Twilio). AUTH_TOKEN is needed to validate webhook signatures;
      # FROM_NUMBER + FORWARD_TO drive the call-back forwarding in /api/voice/incoming.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: VOICE_FORWARD_TO
        sync: false

  # Qdrant vector database (private, not exposed to internet)
  - type: pserv
    name: qdrant
    runtime: image
    image:
      url: qdrant/qdrant:latest
    plan: starter
    region: oregon
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 1
